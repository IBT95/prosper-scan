name: Prosper Zimmo-scan

on:
  schedule:
    - cron: "15 4 * * *"   # elke dag 04:15 UTC (06:15 zomertijd / 05:15 wintertijd)
  workflow_dispatch:
    inputs:
      max_results:
        description: "Max. aantal zoekertjes (kosten begrenzen)"
        default: "600"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scan via Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MAX_RESULTS: ${{ inputs.max_results }}
        run: python apify_scan.py
      - name: Resultaat opslaan
        if: always()
        run: |
          git config user.name "prosper-bot"
          git config user.email "prosper-bot@users.noreply.github.com"
          git add data
          git commit -m "Scan $(date -u +%F)" || echo "Geen wijzigingen"
          git push
