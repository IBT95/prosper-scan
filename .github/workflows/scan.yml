yaml
name: Prosper Zimmo-scan

on:
  schedule:
    - cron: "15 4 * * *"   # elke dag 04:15 UTC (06:15 zomertijd / 05:15 wintertijd)
  workflow_dispatch:
    inputs:
      debug:
        description: "Ruwe HTML bewaren (debug)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Scan
        run: python scan.py ${{ inputs.debug && '--debug' || '' }}
      - name: Resultaat opslaan
        run: |
          git config user.name "prosper-bot"
          git config user.email "prosper-bot@users.noreply.github.com"
          git add data debug 2>/dev/null || git add data
          git commit -m "Scan $(date -u +%F)" || echo "Geen wijzigingen"
          git push
