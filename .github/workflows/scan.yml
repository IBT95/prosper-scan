name: Prosper Zimmo-scan

on:
  schedule:
    - cron: "15 4 * * 2-5"   # di-vr 04:15 UTC: 40 recentste zoekertjes
    - cron: "15 4 * * 1"     # maandag: 100 recentste (vangt ook het weekend op)
    - cron: "15 4 1 * *"     # de 1e van de maand: volledige lijst
  workflow_dispatch:
    inputs:
      modus:
        description: "nieuw (recentste zoekertjes) of volledig (hele zone)"
        type: choice
        options: [nieuw, volledig]
        default: nieuw
      max_results:
        description: "Max. aantal zoekertjes (leeg = 40 bij nieuw, 900 bij volledig)"
        default: ""

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scan via Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MODUS: ${{ github.event.schedule == '15 4 1 * *' && 'volledig' || inputs.modus || 'nieuw' }}
          MAX_RESULTS: ${{ github.event.schedule == '15 4 * * 1' && '100' || inputs.max_results }}
        run: python apify_scan.py
      - name: Resultaat opslaan
        if: always()
        run: |
          git config user.name "prosper-bot"
          git config user.email "prosper-bot@users.noreply.github.com"
          git add data
          git commit -m "Scan $(date -u +%F)" || echo "Geen wijzigingen"
          git push
